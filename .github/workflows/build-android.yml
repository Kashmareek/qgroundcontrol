name: Android APK Build (sky-rus)
on: [push, workflow_dispatch]
jobs:
  build-android:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
      with: { submodules: recursive }
    - uses: actions/setup-java@v5
      with: { distribution: 'temurin', java-version: '11' }
    - uses: jurplel/install-qt-action@v3
      with: { version: '5.15.2', target: 'android' }
    - name: Build QGC (CMake)
      run: |
        sudo apt-get install -y ninja-build
        mkdir build && cd build
        cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake -DANDROID_ABI=arm64-v8a
        cmake --build . --config Release
        cmake --build . --target apk || true
    - uses: actions/upload-artifact@v4
      with: 
        name: QGC-RM510-Build
        path: "**/*.apk"
        retention-days: 3
